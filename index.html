<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>SalinasPrime - Sistema de Ventas & Admin</title>
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/logo4.png">

  <!-- Tailwind CSS por CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f3ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              900: '#1e1b4b'
            }
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="h-full font-sans antialiased text-slate-800 bg-slate-50 selection:bg-brand-500 selection:text-white">

<!-- Pantalla de carga inicial -->
<div id="pantalla-carga" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/80 backdrop-blur-sm">
  <div class="relative flex items-center justify-center">
    <div class="w-16 h-16 border-4 border-brand-500/20 border-t-brand-500 rounded-full animate-spin"></div>
    <div class="absolute w-8 h-8 border-4 border-indigo-400/30 border-b-indigo-400 rounded-full animate-spin" style="animation-direction: reverse; animation-duration: 0.6s;"></div>
  </div>
</div>

<!-- ======================= LOGIN / REGISTRO INICIAL ======================= -->
<div id="vista-login" class="oculto min-h-screen flex items-center justify-center p-4 bg-slate-900 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-800 via-slate-900 to-black">
  <div class="w-full max-w-md bg-slate-800/80 backdrop-blur-xl border border-slate-700/50 rounded-2xl p-8 shadow-2xl space-y-6">
    <div class="flex justify-center">
      <img src="icons/logo5.png" alt="Logo Negocio" class="h-16 w-auto object-contain drop-shadow-md">
    </div>
    
    <div class="text-center space-y-1">
      <h1 id="titulo-login" class="text-2xl font-bold tracking-tight text-white">Iniciar sesión</h1>
      <p class="subt text-sm text-slate-400" id="subt-login">Ingresa tus credenciales para acceder</p>
    </div>

    <div id="mensaje-login"></div>

    <!-- Formulario de login -->
    <form id="form-login" class="space-y-4">
      <div class="campo space-y-1.5">
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">Usuario</label>
        <input type="text" id="login-usuario" autocomplete="username" required
               class="w-full px-4 py-3 rounded-xl bg-slate-900/60 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition duration-200">
      </div>
      <div class="campo space-y-1.5">
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">Contraseña</label>
        <input type="password" id="login-password" autocomplete="current-password" required
               class="w-full px-4 py-3 rounded-xl bg-slate-900/60 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition duration-200">
      </div>
      <button type="submit" class="btn btn-primario w-full py-3 px-4 rounded-xl font-medium text-white bg-brand-600 hover:bg-brand-500 active:scale-[0.99] transition duration-200 shadow-lg shadow-brand-600/30">
        Entrar
      </button>
    </form>

    <!-- Formulario de primer registro (solo si no hay usuarios aún) -->
    <form id="form-registro" class="oculto space-y-4">
      <div class="campo space-y-1.5">
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">Nombre del encargado</label>
        <input type="text" id="reg-nombre" required
               class="w-full px-4 py-3 rounded-xl bg-slate-900/60 border border-slate-700 text-white focus:outline-none focus:ring-2 focus:ring-brand-500 transition duration-200">
      </div>
      <div class="campo space-y-1.5">
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">Usuario</label>
        <input type="text" id="reg-usuario" required
               class="w-full px-4 py-3 rounded-xl bg-slate-900/60 border border-slate-700 text-white focus:outline-none focus:ring-2 focus:ring-brand-500 transition duration-200">
      </div>
      <div class="campo space-y-1.5">
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">Contraseña</label>
        <input type="password" id="reg-password" required minlength="4"
               class="w-full px-4 py-3 rounded-xl bg-slate-900/60 border border-slate-700 text-white focus:outline-none focus:ring-2 focus:ring-brand-500 transition duration-200">
      </div>
      <button type="submit" class="btn btn-primario w-full py-3 px-4 rounded-xl font-medium text-white bg-brand-600 hover:bg-brand-500 active:scale-[0.99] transition duration-200 shadow-lg shadow-brand-600/30">
        Crear cuenta y entrar
      </button>
    </form>
  </div>
</div>

<!-- ======================= APP PRINCIPAL ======================= -->
<div id="app-shell" class="oculto min-h-screen flex flex-col md:flex-row bg-slate-50">
  
  <!-- BARRA LATERAL -->
  <nav class="barra-lateral md:w-64 bg-slate-900 text-slate-300 flex flex-col justify-between p-4 border-r border-slate-800 shrink-0">
    <div class="space-y-6">
      <div class="contenedor-logo-lateral flex items-center justify-center p-2 bg-slate-800/50 rounded-xl border border-slate-700/50">
        <img src="icons/logo6.png" alt="Salinas Prime" class="logo-lateral h-10 w-auto object-contain">
      </div>

      <div class="nav-lateral space-y-1">
        <button class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium hover:bg-slate-800 hover:text-white transition duration-200" data-vista="dashboard">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="9" rx="1" />
            <rect x="14" y="3" width="7" height="5" rx="1" />
            <rect x="14" y="12" width="7" height="9" rx="1" />
            <rect x="3" y="16" width="7" height="5" rx="1" />
          </svg>
          <span>Inicio</span>
        </button>

        <button class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium hover:bg-slate-800 hover:text-white transition duration-200" data-vista="ventas">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 2H4a2 2 0 0 0-2 2v5c0 .5.2 1 .6 1.4l9 9c.8.8 2 .8 2.8 0l6-6c.8-.8.8-2 0-2.8l-9-9C10.9 2.2 9.5 2 9 2Z" />
            <circle cx="7" cy="7" r="1.4" />
          </svg>
          <span>Ventas</span>
        </button>

        <button class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium hover:bg-slate-800 hover:text-white transition duration-200" data-vista="inventario">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 8 12 3 3 8l9 5 9-5Z" />
            <path d="M3 8v8l9 5 9-5V8" />
            <path d="M12 13v8" />
          </svg>
          <span>Inventario</span>
        </button>

        <button class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium hover:bg-slate-800 hover:text-white transition duration-200" data-vista="clientes">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="9" cy="8" r="3.2" />
            <path d="M2.5 20c1-3.6 3.6-5.6 6.5-5.6s5.5 2 6.5 5.6" />
            <circle cx="17.5" cy="8.5" r="2.5" />
            <path d="M15.7 14.6c2.3.4 4 2.2 4.8 5.4" />
          </svg>
          <span>Clientes</span>
        </button>

        <button class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium hover:bg-slate-800 hover:text-white transition duration-200" data-vista="cortes">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 2h9l3 3v17H6z" />
            <path d="M9 8h6M9 12h6M9 16h4" />
          </svg>
          <span>Cortes</span>
        </button>

        <button class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium hover:bg-slate-800 hover:text-white transition duration-200" data-vista="reportes">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 3v18h18" />
            <path d="M18.7 8l-5.1 5.2-2.8-2.7L7 14.3" />
          </svg>
          <span>Reportes</span>
        </button>
      </div>
    </div>

    <button class="btn-salir w-full flex items-center gap-3 px-4 py-3 mt-6 rounded-xl text-sm font-medium text-slate-400 hover:bg-rose-500/10 hover:text-rose-400 transition duration-200" id="btn-cerrar-sesion">
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
        <path d="M16 17l5-5-5-5" />
        <path d="M21 12H9" />
      </svg>
      <span>Salir</span>
    </button>
  </nav>

  <!-- CONTENIDO PRINCIPAL -->
  <div class="contenido-principal flex-1 flex flex-col min-w-0 bg-slate-50">
    <header class="barra-superior bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between shadow-sm sticky top-0 z-10">
      <h2 id="titulo-vista" class="text-xl font-bold text-slate-800 tracking-tight">Inicio</h2>
      <div class="usuario-actual flex items-center gap-3 bg-slate-100 px-3 py-1.5 rounded-full border border-slate-200">
        <span id="nombre-usuario-actual" class="text-xs font-semibold text-slate-700"></span>
        <div class="usuario-avatar w-7 h-7 rounded-full bg-brand-600 text-white text-xs font-bold flex items-center justify-center shadow-sm" id="avatar-usuario-actual"></div>
      </div>
    </header>
    
    <main class="zona-vista p-6 flex-1 overflow-y-auto" id="zona-vista">
      <!-- Las vistas se renderizan aquí vía JS -->
    </main>
  </div>
</div>

<!-- Contenedor genérico para modales -->
<div id="modal-root"></div>

<!-- Scripts locales para funcionamiento offline -->
<script src="js/chart.min.js"></script>
<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/vistas.js"></script>
<script src="js/app.js"></script>
</body>
</html>
